[package]
name = "tunerift"
version = "0.1.4"
edition = "2024"
description = "A terminal radio. Tune into the world."
license = "MIT"
repository = "https://github.com/Nyakooo/tunerift"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6"
m3u8-rs = "6"
ctrlc = "3"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }

flate2 = "1"
tar = "0.4"
self-replace = "1.5"
semver = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
zip = { version = "9.3", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
